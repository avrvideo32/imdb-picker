name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --upgrade duckdb

      - name: Compile application and scripts
        run: python -m compileall -q app.py filters.py queries.py watched.py utils.py scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
