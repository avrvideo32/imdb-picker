name: Weekly IMDb Dataset Update

on:
  schedule:
    # Runs at 05:00 UTC every Sunday
    - cron: '0 5 * * 0'
  workflow_dispatch: # Allows you to trigger it manually from the GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests huggingface_hub

      - name: Run dataset conversion and upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          python scripts/update_imdb.py
